<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Security rule: the browser itself blocks every network connection from this page
     (no fetch, uploads, web sockets, beacons, external scripts, fonts, images or frames).
     Everything this tracker needs is inside this one file. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; child-src 'none'; worker-src 'none'; manifest-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Distance Support Time Tracker 4.12</title>
<style>
:root{
  --bg:#f7f8fa; --panel:#ffffff; --ink:#1a1d23; --sub:#5b6270;
  --line:#e3e6ea; --accent:#4f6df5; --accent-ink:#ffffff;
  --warn:#b45309; --danger:#dc2626; --done:#059669;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12141a; --panel:#1c1f27; --ink:#eef0f3; --sub:#9aa1ae;
    --line:#2c2f3a; --accent:#7c93ff; --accent-ink:#ffffff;
    --warn:#f59e0b; --danger:#ef4444; --done:#34d399;
  }
}
:root[data-theme="dark"]{
  --bg:#12141a; --panel:#1c1f27; --ink:#eef0f3; --sub:#9aa1ae;
  --line:#2c2f3a; --accent:#7c93ff; --accent-ink:#ffffff;
  --warn:#f59e0b; --danger:#ef4444; --done:#34d399;
}
html{background:var(--bg); scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100%; padding:20px 20px 64px;
}
.wrap{max-width:1100px; margin:0 auto;}
.form-row{max-width:780px;}
h1{font-size:1.4rem; margin:8px 0 4px;}
.sub{color:var(--sub); margin:0 0 20px; font-size:0.9rem;}

.form-row{
  display:flex; gap:10px; margin-bottom:24px; flex-wrap:wrap;
}
input{
  flex:1; min-width:140px; padding:10px 12px; border:1px solid var(--line);
  border-radius:8px; background:var(--panel); color:var(--ink); font-size:0.95rem;
}
input:focus{outline:2px solid var(--accent); outline-offset:1px;}
button{
  font-family:inherit; font-size:0.85rem; border:1px solid var(--line); border-radius:8px;
  padding:7px 14px; cursor:pointer; transition:opacity .15s;
  background:var(--panel); color:var(--ink);
}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
button:hover{opacity:0.85;}
.btn-primary{background:var(--accent); color:var(--accent-ink); border-color:transparent;}
.btn-ghost{background:transparent; color:var(--sub); border:1px solid var(--line);}

.toolbar{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; gap:12px; flex-wrap:wrap;}

.tabs{display:flex; gap:4px; margin-bottom:14px; border-bottom:1px solid var(--line);}
.tab-btn{
  background:transparent; border:none; border-radius:0; padding:9px 4px; margin-right:18px;
  font-size:0.9rem; color:var(--sub); border-bottom:2px solid transparent; opacity:1;
}
.tab-btn.active{color:var(--ink); font-weight:600; border-bottom-color:var(--accent);}
.tab-btn:hover{opacity:1; color:var(--ink);}
.count{color:var(--sub); font-size:0.85rem;}
.count.warn{color:var(--warn); font-weight:600;}
.banner{background:var(--danger); color:#fff; border-radius:8px; padding:10px 14px; margin:0 0 16px; font-size:0.88rem; line-height:1.4;}
.banner[hidden]{display:none;}
.notice{display:flex; align-items:flex-start; gap:10px; justify-content:space-between; background:var(--panel); border:1px solid var(--line);
  border-left:4px solid var(--warn); border-radius:12px; padding:10px 12px; margin:0 0 16px; font-size:0.88rem; line-height:1.4;}
.notice[hidden]{display:none;}
.notice button{background:transparent; border:none; color:var(--sub); padding:0 4px; font-size:0.95rem; line-height:1.2;}
.auto-paused{color:var(--warn); font-size:0.78rem; margin:-4px 0 8px; font-weight:600;}
.show-more{grid-column:1 / -1; display:flex; justify-content:center; padding:6px 0;}

#ticket-list{
  display:grid; gap:10px;
  grid-template-columns:repeat(auto-fill, minmax(min(100%, 250px), 1fr));
}
.empty{grid-column:1 / -1; color:var(--sub); font-size:0.9rem; padding:28px 0; text-align:center; border:2px dashed var(--line); border-radius:12px;}

.card{
  background:var(--panel); border:1px solid var(--line); border-radius:12px;
  padding:14px 16px; display:flex; flex-direction:column; min-width:0;
}
.card-top{display:flex; justify-content:space-between; gap:8px; align-items:flex-start;}
.card-top > div{min-width:0;}
.card-title{font-weight:600; font-size:0.95rem;}
.card-agent{color:var(--sub); font-size:0.8rem; margin-top:1px;}
.card-customer, .card-agent{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.card .actions{margin-top:auto;}
.card .actions button{padding:5px 10px; font-size:0.8rem;}
.edit-form{display:flex; flex-direction:column; gap:6px; margin-bottom:8px;}
.edit-form input, .edit-form textarea{min-width:0; width:100%; padding:7px 9px; font-size:0.88rem;}
.status{
  font-size:0.75rem; padding:2px 9px; border-radius:999px; white-space:nowrap; font-weight:600;
  border:1px solid transparent;
}
.status.notstarted{border-color:var(--line); color:var(--sub);}
.status.running{background:var(--accent); color:var(--accent-ink);}
.status.paused{background:rgba(245,158,11,.18); color:var(--warn);}
.status.finished{background:rgba(52,211,153,.18); color:var(--done);}

.timer{font-size:1.25rem; font-variant-numeric:tabular-nums; margin:6px 0 8px;}
.competency{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:0 0 10px; font-size:0.8rem; color:var(--sub);}
.competency select{
  font:inherit; font-size:0.82rem; color:var(--ink); background:var(--panel);
  border:1px solid var(--line); border-radius:6px; padding:4px 6px; min-width:96px;
}
.competency select:focus{outline:2px solid var(--accent); outline-offset:1px;}
.competency.unrated select{color:var(--sub);}
.actions{display:flex; gap:8px; flex-wrap:wrap;}
.actions button{padding:7px 13px; font-size:0.85rem;}
.act-start{background:var(--accent); color:var(--accent-ink); border-color:transparent;}
.act-pause{background:var(--warn); color:#fff; border-color:transparent;}
.act-edit{background:var(--accent); color:var(--accent-ink); border-color:transparent;}
.act-finish{background:var(--danger); color:#fff; border-color:transparent;}
.act-remove{background:transparent; color:var(--sub); border:1px solid var(--line);}
.meta{color:var(--sub); font-size:0.78rem; margin:-4px 0 8px;}

.export-button{margin-top:4px;}

.header-row{display:flex; justify-content:space-between; align-items:flex-start; gap:12px;}
.theme-toggle{
  background:transparent; border:1px solid var(--line); color:var(--sub);
  margin-top:8px; white-space:nowrap;
}
textarea{
  flex:1; min-width:140px; padding:10px 12px; border:1px solid var(--line);
  border-radius:8px; background:var(--panel); color:var(--ink); font-size:0.95rem;
  font-family:inherit; resize:vertical; min-height:40px;
}
textarea:focus{outline:2px solid var(--accent); outline-offset:1px;}
.card-customer{font-size:0.8rem; margin-top:1px; color:var(--ink);}
.card-complaint{
  font-size:0.82rem; color:var(--sub); margin-top:5px; line-height:1.35;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  overflow-wrap:anywhere;
}

.overlay{
  position:fixed; inset:0; background:var(--bg); z-index:50;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.login-box{
  background:var(--panel); border:1px solid var(--line); border-radius:12px;
  padding:28px 24px; max-width:340px; width:100%;
}
.login-box h2{margin:0 0 6px; font-size:1.15rem;}
.login-box p{margin:0 0 16px; color:var(--sub); font-size:0.88rem;}
.login-box input{width:100%; margin-bottom:12px;}
.login-box button{width:100%;}
.agent-badge{
  display:flex; align-items:center; gap:8px; font-size:0.85rem; color:var(--sub);
}
.agent-badge button{padding:4px 10px; font-size:0.78rem; background:transparent; border:1px solid var(--line); color:var(--ink);}
</style>
</head>
<body>
<div class="overlay" id="login-overlay">
  <div class="login-box">
    <h2 id="auth-title">Sign in</h2>
    <p id="auth-subtitle"></p>
    <input id="login-agent-input" type="text" placeholder="Agent ID" autocomplete="off">
    <input id="login-pin-input" type="password" inputmode="numeric" placeholder="PIN (4–6 digits)" maxlength="6" autocomplete="off">
    <input id="login-pin-confirm-input" type="password" inputmode="numeric" placeholder="Confirm PIN" maxlength="6" autocomplete="off" style="display:none;">
    <div id="auth-error" style="color:var(--danger); font-size:0.82rem; margin:-4px 0 12px; display:none;"></div>
    <button class="btn-primary" id="auth-submit-button">Sign in</button>
    <button class="btn-ghost" id="auth-alt-button" type="button" style="margin-top:8px; display:none;"></button>
    <button class="btn-ghost" id="auth-reset-button" type="button" style="margin-top:8px; display:none;">Forgot PIN? Reset account</button>
    <p id="auth-note" style="font-size:0.75rem; color:var(--sub); margin-top:10px; margin-bottom:0;"></p>
  </div>
</div>

<div class="wrap" inert aria-hidden="true">
  <div class="banner" id="storage-banner" role="alert" hidden></div>
  <div class="notice" id="info-banner" role="status" hidden><span id="info-text"></span><button type="button" id="info-close" aria-label="Dismiss">✕</button></div>
  <div class="header-row">
    <div>
      <h1>⏱️ Distance Support Time Tracker</h1>
      <p class="sub">Log how long each ticket takes, pause for interruptions, then export the totals.</p>
    </div>
    <button class="theme-toggle" id="theme-toggle-button" type="button">🌙 Dark Mode</button>
  </div>

  <div class="agent-badge" id="agent-badge" style="margin-bottom:16px;"></div>

  <div class="form-row">
    <input id="customer-input" type="text" placeholder="Customer name" aria-label="Customer name" list="ship-list" autocomplete="off">
  </div>
  <div class="form-row">
    <input id="category-input" type="text" placeholder="Category" aria-label="Category" list="category-list" autocomplete="off">
  </div>
  <datalist id="ship-list"></datalist>
  <datalist id="category-list"></datalist>
  <div class="form-row">
    <textarea id="complaint-input" placeholder="Complaint / issue description" aria-label="Complaint"></textarea>
  </div>
  <div class="form-row">
    <button class="btn-primary" id="new-ticket-button">New ticket</button>
  </div>

  <div class="tabs">
    <button class="tab-btn" id="tab-active" type="button">In Progress</button>
    <button class="tab-btn" id="tab-finished" type="button">Finished</button>
  </div>

  <div class="toolbar">
    <span class="count" id="ticket-count"></span>
    <button class="btn-ghost export-button" id="export-button">Export as CSV</button>
  </div>

  <div class="toolbar" id="log-bar" style="margin-bottom:16px;"></div>

  <div id="ticket-list"></div>
</div>

<script>
(function(){
  const THEME_KEY = 'ticket-tracker:theme';

  const CURRENT_AGENT_KEY = 'ticket-tracker:current-agent';
  const LEGACY_ACCOUNTS_KEY = 'ticket-tracker:local-accounts'; // read once to upgrade older versions
  const CATEGORIES_KEY = 'ticket-tracker:categories';
  const DEFAULT_CATEGORIES = ['Hardware','Software','Power','Networks','Lowband','Highband','IO','Mission Modules'];

  let categories = [];
  let currentAgent = null;
  let authMode = 'login';

  function normalizeAgentKey(id){
    return (id || '').trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'') || 'agent';
  }
  async function hashPin(key, pin){
    const enc = new TextEncoder().encode('ticket-tracker:'+key+':'+pin);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  // ---- Single account ----
  // This copy of the tracker holds exactly one account. No accounts file, no merging, and no
  // way to end up with two accounts for the same person.
  const ACCOUNT_KEY = 'ticket-tracker:account';
  let account = null;          // {agentId, pinHash, createdAt}
  let legacyAccounts = null;   // only used once, when upgrading a browser that had several accounts

  function readAccount(){
    try{ const raw = localStorage.getItem(ACCOUNT_KEY); const a = raw ? JSON.parse(raw) : null; return a && a.pinHash ? a : null; }
    catch(e){ return null; }
  }
  function saveAccount(a){
    account = a;
    try{ localStorage.setItem(ACCOUNT_KEY, JSON.stringify(a)); }catch(e){}
  }
  function loadAccount(){
    account = readAccount();
    legacyAccounts = null;
    if(!account) migrateLegacyAccounts();
  }
  // Older versions stored several accounts. If the right one is obvious, adopt it silently;
  // otherwise the first person to sign in with one of them claims this tracker.
  function migrateLegacyAccounts(){
    let legacy = {};
    try{ legacy = JSON.parse(localStorage.getItem(LEGACY_ACCOUNTS_KEY) || '{}') || {}; }catch(e){}
    const keys = Object.keys(legacy).filter(k => legacy[k] && legacy[k].pinHash);
    if(!keys.length) return;
    let pick = null;
    if(keys.length === 1) pick = legacy[keys[0]];
    else{
      let cur = null;
      try{ cur = localStorage.getItem(CURRENT_AGENT_KEY); }catch(e){}
      if(cur && legacy[normalizeAgentKey(cur)]) pick = legacy[normalizeAgentKey(cur)];
    }
    if(pick){ saveAccount(pick); return; }
    legacyAccounts = legacy;
  }
  const SHIP_NAMES = ["BERTHOLF","CALHOUN","HAMILTON","JAMES","KIMBALL","MIDGETT","MUNRO","STONE","STRATTON","USS ABRAHAM LINCOLN","USS AMERICA","USS ANCHORAGE","USS ARLEIGH BURKE","USS ARLINGTON","USS BAINBRIDGE","USS BARRY","USS BATAAN","USS BENFOLD","USS BLUE RIDGE","USS BOXER","USS BULKELEY","USS CAPE ST. GEORGE","USS CARL M. LEVIN","USS CARL VINSON","USS CARNEY","USS CHAFEE","USS CHOSIN","USS CHUNG-HOON","USS CURTIS WILBUR","USS DANIEL INOUYE","USS DECATUR","USS DELBERT D. BLACK","USS DEWEY","USS DONALD COOK","USS DWIGHT D. EISENHOWER","USS ESSEX","USS FARRAGUT","USS FITZGERALD","USS FOREST SHERMAN","USS FORT LAUDERDALE","USS FRANK E. PETERSON","USS GEORGE H.W. BUSH","USS GEORGE WASHINGTON","USS GERALD R. FORD","USS GETTYSBURG","USS GONZALEZ","USS GRAVELY","USS GREEN BAY","USS GRIDLEY","USS HALSEY","USS HARRY S. TRUMAN","USS HIGGINS","USS HOPPER","USS HOWARD","USS IWO JIMA","USS JACK H LUCAS","USS JAMES E WILLIAMS","USS JASON DUNHAM","USS JOHN BASILONE","USS JOHN C. STENNIS","USS JOHN FINN","USS JOHN P. MURTHA","USS JOHN PAUL JONES","USS JOHN S. MCCAIN","USS KEARSARGE","USS KIDD","USS LABOON","USS LAKE ERIE","USS LASSEN","USS LENAH S.HIGBEE","USS MAHAN","USS MAKIN ISLAND","USS MASON","USS MCCAMPBELL","USS MCFAUL","USS MICHAEL MONSOOR","USS MICHAEL MURPHY","USS MILIUS","USS MITSCHER","USS MOMSEN","USS MT WHITNEY","USS MUSTIN","USS NEW ORLEANS","USS NIMITZ","USS NITZE","USS OSCAR AUSTIN","USS O\u2019KANE","USS PAUL HAMILTON","USS PAUL IGNATIOUS","USS PINCKNEY","USS PORTER","USS PORTLAND","USS PREBLE","USS PRINCETON","USS RAFAEL PERALTA","USS RALPH JOHNSON","USS RAMAGE","USS RICHARD M MCCOOL","USS ROBERT SMALLS","USS RONALD REAGAN","USS ROOSEVELT","USS ROSS","USS RUSSELL","USS SAMPSON","USS SAN ANTONIO","USS SAN DIEGO","USS SHILOH","USS SHOUP","USS SOMERSET","USS SPRUANCE","USS STERETT","USS STETHEM","USS STOCKDALE","USS STOUT","USS T. ROOSEVELT","USS THE SULLIVANS","USS THOMAS HUDNER","USS TRIPOLI","USS TRUXTUN","USS MESA VERDE","USS NEW YORK","USS WASP","USS WAYNE E. MEYER","USS WILLIAM P. LAWRENCE","USS WINSTON S CHURCHILL","WAESCHE"];
  let tickets = [];
  let editingId = null;
  let activeTab = 'active';
  const intervalIds = {};

  function populateShipList(){
    const dl = document.getElementById('ship-list');
    dl.innerHTML = SHIP_NAMES.map(n => `<option value="${escapeHtml(n)}"></option>`).join('');
  }


  function loadCategories(){
    try{
      const raw = localStorage.getItem(CATEGORIES_KEY);
      categories = raw ? JSON.parse(raw) : DEFAULT_CATEGORIES.slice();
    }catch(e){ categories = DEFAULT_CATEGORIES.slice(); }
    if(!categories.length) categories = DEFAULT_CATEGORIES.slice();
    saveCategories();
    populateCategoryList();
  }
  function saveCategories(){
    try{ localStorage.setItem(CATEGORIES_KEY, JSON.stringify(categories)); }catch(e){}
  }
  function populateCategoryList(){
    const dl = document.getElementById('category-list');
    dl.innerHTML = categories.slice().sort().map(n => `<option value="${escapeHtml(n)}"></option>`).join('');
  }
  function ensureCategory(name){
    const trimmed = (name || '').trim();
    if(!trimmed) return;
    if(!categories.some(c => c.toLowerCase() === trimmed.toLowerCase())){
      categories.push(trimmed);
      saveCategories();
      populateCategoryList();
      if(account) scheduleStateWrite();
    }
  }

  function renderAgentBadge(){
    const badge = document.getElementById('agent-badge');
    if(!currentAgent){ badge.innerHTML=''; return; }
    badge.innerHTML = `Signed in as <strong style="color:var(--ink)">${escapeHtml(currentAgent)}</strong>`;
    const lockBtn = document.createElement('button');
    lockBtn.textContent = 'Sign out';
    lockBtn.onclick = logoutAgent;
    badge.appendChild(lockBtn);
  }

  // Modes: 'login'  (account saved in this browser)
  //        'legacy' (pick one of several accounts from a much older version)
  //        'start'  (nothing in this browser: sign in from the log folder, or set up)
  //        'folder' (log folder chosen; enter PIN for the account saved in it)
  //        'setup'  (create a new account)
  let authView = null;        // which of start/folder/setup to show when the browser has no account
  let folderSignIn = null;    // {handle, accounts:[{fileName, data}]} while in 'folder' mode
  function folderCapable(){ return DIR_SUPPORTED && !EMBEDDED; }
  function currentAuthMode(){
    if(account) return 'login';
    if(legacyAccounts) return 'legacy';
    if(authView === 'folder' && folderSignIn) return 'folder';
    if(authView === 'setup' || !folderCapable()) return 'setup';
    return 'start';
  }
  function folderAccountChoices(){
    return folderSignIn ? folderSignIn.accounts : [];
  }
  function renderAuth(){
    authMode = currentAuthMode();
    const title = document.getElementById('auth-title');
    const subtitle = document.getElementById('auth-subtitle');
    const agentInput = document.getElementById('login-agent-input');
    const pinInput = document.getElementById('login-pin-input');
    const confirmInput = document.getElementById('login-pin-confirm-input');
    const submit = document.getElementById('auth-submit-button');
    const alt = document.getElementById('auth-alt-button');
    const reset = document.getElementById('auth-reset-button');
    const note = document.getElementById('auth-note');
    let showAgent = false, showPin = true, showConfirm = false, altText = '', noteText = '';
    if(authMode === 'login'){
      title.textContent = `Welcome back, ${account.agentId}`;
      subtitle.textContent = 'Enter your PIN to continue.';
      submit.textContent = 'Sign in';
      noteText = 'Your account is saved in this browser and in your log folder.';
    }else if(authMode === 'legacy'){
      title.textContent = 'Choose this tracker’s account';
      subtitle.textContent = 'This browser has accounts from an older version. Sign in with yours and it becomes the only account here.';
      submit.textContent = 'Sign in';
      showAgent = true;
    }else if(authMode === 'start'){
      title.textContent = 'Sign in';
      subtitle.textContent = 'Choose your log folder (the one with your ticket-work-log files) to sign in.';
      submit.textContent = 'Sign in with my log folder';
      showPin = false;
      altText = 'First time? Set up a new account';
      noteText = 'Your account and open tickets are saved in your log folder, so you can sign back in even if the browser cleared its data.';
    }else if(authMode === 'folder'){
      const choices = folderAccountChoices();
      if(choices.length === 1){
        title.textContent = `Welcome back, ${choices[0].data.account.agentId}`;
        subtitle.textContent = 'Enter your PIN to continue.';
      }else{
        title.textContent = 'Sign in';
        subtitle.textContent = `This folder has ${choices.length} accounts. Enter your Agent ID and PIN.`;
        showAgent = true;
      }
      submit.textContent = 'Sign in';
      altText = 'Choose a different folder';
      noteText = `Log folder: ${folderSignIn.handle.name}`;
    }else{
      title.textContent = 'Set up your tracker';
      subtitle.textContent = 'Choose your Agent ID and a 4–6 digit PIN.';
      submit.textContent = folderCapable() && !(logDirHandle && logDirReady) ? 'Create account & choose log folder' : 'Create account';
      showAgent = true; showConfirm = true;
      if(folderCapable()) altText = 'Back to sign in';
      noteText = folderCapable()
        ? 'Next you’ll choose the folder for your work log (for example your synced SharePoint folder). Your account is saved there too.'
        : 'Your account is saved in this browser.';
    }
    agentInput.style.display = showAgent ? 'block' : 'none';
    pinInput.style.display = showPin ? 'block' : 'none';
    confirmInput.style.display = showConfirm ? 'block' : 'none';
    alt.style.display = altText ? 'block' : 'none';
    alt.textContent = altText;
    reset.style.display = authMode === 'login' ? 'block' : 'none';
    note.textContent = noteText;
    note.style.display = noteText ? 'block' : 'none';
    pinInput.value = '';
    confirmInput.value = '';
    showAuthError('');
  }
  function showAuthError(msg){
    const el = document.getElementById('auth-error');
    el.textContent = msg;
    el.style.display = msg ? 'block' : 'none';
  }
  function focusAuth(){
    const id = (authMode === 'login' || (authMode === 'folder' && folderAccountChoices().length === 1)) ? 'login-pin-input'
             : authMode === 'start' ? 'auth-submit-button' : 'login-agent-input';
    setTimeout(()=>{ try{ document.getElementById(id).focus(); }catch(e){} }, 0);
  }
  function handleAuthAlt(){
    if(authMode === 'start'){ authView = 'setup'; }
    else if(authMode === 'setup'){ authView = 'start'; }
    else if(authMode === 'folder'){ authView = 'start'; folderSignIn = null; return beginFolderSignIn(); }
    renderAuth(); focusAuth();
  }

  // Opens the folder picker (or uses a folder already chosen) and looks for saved accounts.
  async function beginFolderSignIn(existingHandle){
    let h = existingHandle || null;
    try{
      if(!h){
        h = await window.showDirectoryPicker({id:'ticket-tracker-logs', mode:'readwrite'});
        const perm = await h.requestPermission({mode:'readwrite'});
        if(perm !== 'granted'){ showAuthError('Write permission was not granted for that folder.'); return; }
      }
    }catch(e){
      if(e && e.name === 'AbortError') return;
      showAuthError('Could not open the folder picker: ' + ((e && e.message) || e));
      return;
    }
    const accounts = await readFolderAccounts(h);
    if(!accounts.length){
      authView = 'start'; folderSignIn = null; renderAuth();
      showAuthError(`No tracker account found in “${h.name}”. Choose the folder that holds your ticket-work-log files, or set up a new account.`);
      return;
    }
    folderSignIn = {handle: h, accounts};
    authView = 'folder';
    renderAuth(); focusAuth();
  }

  async function handleAuthSubmit(){
    // Pick up an account created or reset in another tab.
    loadAccount();
    const mode = currentAuthMode();
    if(authMode !== mode){ renderAuth(); showAuthError('The account changed in another tab — please try again.'); return; }
    if(mode === 'start') return beginFolderSignIn();   // the click is the gesture the picker needs

    // After a browser restart the log folder needs permission again. This click is the user
    // gesture the browser requires, so ask now instead of making the agent find Reconnect.
    if(mode === 'login' && logDirHandle && !logDirReady){
      logDirHandle.requestPermission({mode:'readwrite'}).then(p=>{
        logDirReady = p === 'granted';
        if(logDirReady){ logNotice = ''; syncLogFolder(); scheduleStateWrite(); applyAdminCorrections(); }
        renderLogBar();
      }).catch(()=>{});
    }

    const pin = document.getElementById('login-pin-input').value;
    let agentId;
    if(mode === 'login') agentId = account.agentId;
    else if(mode === 'folder' && folderAccountChoices().length === 1) agentId = folderAccountChoices()[0].data.account.agentId;
    else agentId = document.getElementById('login-agent-input').value.trim();
    if(!agentId){ showAuthError('Enter an Agent ID.'); return; }
    if(!/^\d{4,6}$/.test(pin)){ showAuthError('PIN must be 4–6 digits.'); return; }
    const key = normalizeAgentKey(agentId);
    if(mode === 'setup'){
      const confirmPin = document.getElementById('login-pin-confirm-input').value;
      if(pin !== confirmPin){ showAuthError('PINs do not match.'); return; }
    }

    // Setup: choose the folder FIRST, while this click still counts as a user gesture.
    let setupHandle = null;
    if(mode === 'setup' && folderCapable()){
      if(logDirHandle && logDirReady) setupHandle = logDirHandle;
      else{
        try{
          setupHandle = await window.showDirectoryPicker({id:'ticket-tracker-logs', mode:'readwrite'});
          if(await setupHandle.requestPermission({mode:'readwrite'}) !== 'granted') setupHandle = null;
        }catch(e){ setupHandle = null; }   // cancelled: account is saved in this browser only for now
      }
    }

    const submitBtn = document.getElementById('auth-submit-button');
    submitBtn.disabled = true;
    try{
      if(mode === 'setup'){
        if(setupHandle){
          const existing = (await readFolderAccounts(setupHandle)).find(a => normalizeAgentKey(a.data.account.agentId) === key);
          const replacing = readPendingReset();
          if(existing && !(replacing && replacing.agentKey === key && replacing.createdAt === existing.data.account.createdAt)){
            // Don't create a duplicate: this agent already has an account saved in this folder.
            folderSignIn = {handle: setupHandle, accounts: [existing]};
            authView = 'folder';
            renderAuth(); focusAuth();
            showAuthError(`${existing.data.account.agentId} already has an account in this folder. Enter that account’s PIN to sign in.`);
            return;
          }
        }
        const acc = await makeAccount(agentId, pin);
        const replacing = readPendingReset();
        if(replacing && replacing.agentKey === key) acc.supersedes = replacing.createdAt;
        clearPendingReset();
        saveAccount(acc);
        if(setupHandle) await connectFolder(setupHandle);
        completeLogin(agentId);
      }else if(mode === 'folder'){
        const match = folderAccountChoices().find(a => normalizeAgentKey(a.data.account.agentId) === key);
        if(!match){ showAuthError('Agent ID or PIN is incorrect.'); return; }
        const res = await verifyPin(match.data.account, pin);
        if(!res.ok){ showAuthError(folderAccountChoices().length === 1 ? 'Incorrect PIN.' : 'Agent ID or PIN is incorrect.'); return; }
        saveAccount(res.account);
        const restored = await importState(match.data);
        const folderLastSeen = Math.max(Number(match.data.lastSeenAt) || 0, Date.parse(match.data.savedAt) || 0);
        await pauseTicketsLeftRunning(Math.max(folderLastSeen, startupLastSeen));
        await connectFolder(folderSignIn.handle);
        folderSignIn = null; authView = null;
        completeLogin(res.account.agentId);
        restoreInfo = `Signed in from your log folder${restored ? ` and restored ${restored} ticket${restored===1?'':'s'}` : ''}.` +
          (wipedThisSession ? ' This browser had no saved tracker data (it may clear data when closed, or this is a different computer); your folder covered it.' : '');
        renderLogBar();
        setTimeout(()=>{ restoreInfo = ''; renderLogBar(); }, 20000);
      }else if(mode === 'legacy'){
        const old = legacyAccounts[key];
        const res = old ? await verifyPin(old, pin) : {ok:false};
        if(!res.ok){ showAuthError('Agent ID or PIN is incorrect.'); return; }
        saveAccount(res.account);
        legacyAccounts = null;
        completeLogin(res.account.agentId || agentId);
      }else{
        const res = await verifyPin(account, pin);
        if(!res.ok){
          // v4.10: maybe the admin reset this agent's PIN; that new account lives in the folder file.
          const reset = await adminResetAccount();
          const r2 = reset ? await verifyPin(reset, pin) : {ok:false};
          if(!r2.ok){ showAuthError('Incorrect PIN.'); return; }
          saveAccount(r2.account);
          stateConflict = null;
          completeLogin(r2.account.agentId);
          showInfo('Signed in with the new PIN your admin set.');
          return;
        }
        if(res.upgraded) saveAccount(res.account);
        completeLogin(account.agentId);
      }
    }catch(e){
      showAuthError('Something went wrong. Please try again.');
    }finally{
      submitBtn.disabled = false;
    }
  }
  // "Forgot PIN": remembered so the new account may replace the old one in the log folder.
  const PENDING_RESET_KEY = 'ticket-tracker:pending-reset';
  function readPendingReset(){ try{ return JSON.parse(localStorage.getItem(PENDING_RESET_KEY) || 'null'); }catch(e){ return null; } }
  function clearPendingReset(){ try{ localStorage.removeItem(PENDING_RESET_KEY); }catch(e){} }
  function resetAccount(){
    if(!account) return;
    const ok = window.confirm('Reset this tracker’s account?\n\nYou’ll set up the Agent ID and PIN again. Tickets and the work log are kept.');
    if(!ok) return;
    const oldId = account.agentId;
    try{ localStorage.setItem(PENDING_RESET_KEY, JSON.stringify({agentKey: normalizeAgentKey(oldId), createdAt: account.createdAt})); }catch(e){}
    try{ localStorage.removeItem(ACCOUNT_KEY); }catch(e){}
    account = null;
    authView = 'setup';
    logEvent('account_reset', null, oldId);
    renderAuth();
    document.getElementById('login-agent-input').value = oldId;
    document.getElementById('login-pin-input').focus();
  }
  function completeLogin(name){
    currentAgent = name;
    try{ localStorage.setItem(CURRENT_AGENT_KEY, currentAgent); }catch(e){}
    setOverlay(false);
    renderAgentBadge();
    renderLogBar();
    logEvent('sign_in', null, name);
    scheduleStateWrite();
  }
  function showLogin(){
    renderAuth();
    setOverlay(true);
    focusAuth();
  }
  function logoutAgent(){
    if(currentAgent) logEvent('sign_out', null, currentAgent);

    try{ localStorage.removeItem(CURRENT_AGENT_KEY); }catch(e){}
    renderAgentBadge();
    showLogin();
  }
  function wireAuthUI(){
    document.getElementById('auth-submit-button').addEventListener('click', handleAuthSubmit);
    document.getElementById('auth-alt-button').addEventListener('click', handleAuthAlt);
    document.getElementById('auth-reset-button').addEventListener('click', resetAccount);
    ['login-agent-input','login-pin-input','login-pin-confirm-input'].forEach(id=>{
      document.getElementById(id).addEventListener('keydown', e=>{ if(e.key === 'Enter') handleAuthSubmit(); });

  // v4.8: while the sign-in screen is up, the page behind it is made inert so nothing on it
  // can be reached with Tab/Enter (previously Remove etc. could be used without a PIN).
  function setOverlay(show){
    document.getElementById('login-overlay').style.display = show ? 'flex' : 'none';
    const wrap = document.querySelector('.wrap');
